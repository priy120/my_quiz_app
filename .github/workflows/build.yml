name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      - name: Recreate Fresh Flutter Android Setup
        run: |
          mkdir -p ../temp_app
          flutter create --org com.example --project-name my_quiz_app ../temp_app
          cp -r lib ../temp_app/
          cp pubspec.yaml ../temp_app/
          cp android/app/src/main/AndroidManifest.xml ../temp_app/android/app/src/main/AndroidManifest.xml || true
          cp -r ../temp_app/* .
          rm -rf ../temp_app

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug --no-multidex

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
