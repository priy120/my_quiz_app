name: Build Android Release APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      - name: Save Custom Android Configs
        run: |
          mkdir -p /tmp/backup_res
          cp -r android/app/src/main/res/* /tmp/backup_res/ || true

      - name: Fix Android V2 Embedding Engine
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.example
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle
          echo 'android.useAndroidX=true' >> android/gradle.properties
          echo 'android.enableJetifier=true' >> android/gradle.properties

      - name: Restore Custom Logo & Set App Name
        run: |
          cp -r /tmp/backup_res/* android/app/src/main/res/ || true
          sed -i 's/android:label=".*"/android:label="Compete Me"/g' android/app/src/main/AndroidManifest.xml

      - name: Inject OTA Install Permission into AndroidManifest
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>' android/app/src/main/AndroidManifest.xml

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
