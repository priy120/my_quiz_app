name: competeme
description: "CompeteMe Portal - Auto Update Test Engine"
publish_to: 'none'

version: 1.0.4+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core Services
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_database: ^10.4.9

  # Network Check (Internet Required)
  connectivity_plus: ^6.0.0

  # Official Google Webview for Real MathJax
  webview_flutter: ^4.7.0

  # In-App Auto Update Packages (100% Free)
  package_info_plus: ^8.0.0
  ota_update: ^6.0.0

  # Native Payments & Links
  razorpay_flutter: ^1.3.7
  url_launcher: ^6.2.5

  # Unity Ads Package
  unity_ads_plugin: ^0.4.0
  
flutter_math_fork: ^0.7.2
  # UI Design
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6

  share_plus: ^10.0.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
