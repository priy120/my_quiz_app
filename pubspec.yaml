name: quizapp
description: "CompeteMe Portal - Native MathJax Test Engine"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core Services
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8

  # HTML & MathJax Rendering
  flutter_html: ^3.0.0-beta.2
  flutter_html_math: ^1.0.0

  # Native Payments & Links
  razorpay_flutter: ^1.3.7
  url_launcher: ^6.2.5

  # UI Design
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
